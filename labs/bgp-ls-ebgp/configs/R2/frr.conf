hostname R2
!
router bgp 65102
 bgp router-id 10.255.0.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 2001:db8:2:3::3 remote-as 65103
 neighbor 2001:db8:2:3::3 description R3
 neighbor 2001:db8:2:4::4 remote-as 65104
 neighbor 2001:db8:2:4::4 description R4
 neighbor 2001:db8:2:5::5 remote-as 65105
 neighbor 2001:db8:2:5::5 description R5
 neighbor 2001:db8:2:ff::ff remote-as 65000
 neighbor 2001:db8:2:ff::ff description RR
 address-family ipv6 unicast
  network 2001:db8:ffff:2::1/128
  neighbor 2001:db8:2:3::3 activate
  neighbor 2001:db8:2:4::4 activate
  neighbor 2001:db8:2:5::5 activate
 exit-address-family
 address-family link-state link-state
  distribute bgp-fabric-link-state
  neighbor 2001:db8:2:ff::ff activate
 exit-address-family
!
