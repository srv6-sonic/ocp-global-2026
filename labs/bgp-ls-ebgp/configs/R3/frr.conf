hostname R3
!
router bgp 65103
 bgp router-id 10.255.0.3
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 2001:db8:1:3::1 remote-as 65101
 neighbor 2001:db8:1:3::1 description R1
 neighbor 2001:db8:2:3::2 remote-as 65102
 neighbor 2001:db8:2:3::2 description R2
 neighbor 2001:db8:3:ff::ff remote-as 65000
 neighbor 2001:db8:3:ff::ff description RR
 address-family ipv6 unicast
  network 2001:db8:ffff:3::1/128
  neighbor 2001:db8:1:3::1 activate
  neighbor 2001:db8:2:3::2 activate
 exit-address-family
 address-family link-state link-state
  distribute bgp-fabric-link-state
  neighbor 2001:db8:3:ff::ff activate
 exit-address-family
!
